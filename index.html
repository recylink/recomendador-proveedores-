<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>Recomendador de Proveedores</title>
<style>
:root { color-scheme: light; --green:#2BAA4A; --green-d:#1f8a3a; --blue:#1C6FB4; --blue-d:#155a93; --lime:#8DC63F; --sky:#6CA9DD; }
* { box-sizing: border-box; }
body { margin:0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background:#f6f7f9; color:#1c2128; font-size:14px; }
.wrap { max-width:1100px; margin:0 auto; padding:16px; }
.brand { display:flex; align-items:center; gap:12px; margin:0 0 2px; }
.brandmark { display:grid; grid-template-columns:repeat(3,9px); grid-auto-rows:9px; gap:2px; transform:rotate(45deg); flex:0 0 auto; }
.brandmark i { display:block; border-radius:1px; }
h1 { font-size:21px; margin:0; font-weight:800; letter-spacing:.5px; }
h1 .r { color:var(--green); } h1 .l { color:var(--blue); }
.sub { color:#667085; margin:6px 0 16px; font-size:13px; border-left:3px solid var(--green); padding-left:8px; }
.controls { display:grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap:10px; background:#fff; padding:14px; border:1px solid #e5e7eb; border-radius:10px; margin-bottom:14px; }
.controls label { display:block; font-size:11px; font-weight:600; color:#667085; text-transform:uppercase; letter-spacing:.04em; margin-bottom:4px; }
select, input[type=text] { width:100%; padding:8px 10px; border:1px solid #d0d5dd; border-radius:8px; font-size:13px; background:#fff; }
.estados { grid-column:1/-1; display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
.estados .chk { display:flex; align-items:center; gap:6px; font-size:13px; color:#344054; }
.bar { height:6px; background:#e5e7eb; border-radius:4px; overflow:hidden; margin:8px 0 0; }
.bar > div { height:100%; background:var(--green); width:0%; transition:width .2s; }
.status-msg { font-size:12px; color:#667085; margin-top:6px; }
.count { font-size:12px; color:#667085; margin:0 0 10px; }
.card { background:#fff; border:1px solid #e5e7eb; border-radius:10px; padding:14px; margin-bottom:10px; }
.card.vetado { background:#fff5f5; border-color:#fca5a5; }
.card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; cursor:pointer; }
.name { font-size:15px; font-weight:700; margin:0; }
.rank { font-size:11px; color:#98a2b3; font-weight:600; }
.score { text-align:right; white-space:nowrap; }
.score .num { font-size:22px; font-weight:800; color:var(--blue-d); line-height:1; }
.score .lbl { font-size:10px; color:#98a2b3; text-transform:uppercase; }
.badges { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0; }
.badge { font-size:11px; padding:3px 8px; border-radius:999px; font-weight:600; }
.b-aprobados { background:#dcfce7; color:#166534; }
.b-bd { background:#dbeafe; color:#1e40af; }
.b-noaprobados { background:#fef3c7; color:#92400e; }
.b-vetados { background:#fee2e2; color:#991b1b; }
.b-planilla { background:#ede9fe; color:#5b21b6; }
.b-sit { background:#f3f4f6; color:#374151; }
.card.planilla { background:#faf5ff; border-color:#ddd6fe; border-style:dashed; }
.stars { color:#f59e0b; letter-spacing:1px; }
.chips { display:flex; flex-wrap:wrap; gap:5px; margin:6px 0; }
.chip { font-size:11px; background:#e6f4ea; color:var(--green-d); padding:2px 8px; border-radius:6px; }
.chip.loc { background:#e7f0fa; color:var(--blue-d); }
.meta { font-size:12px; color:#475467; margin:4px 0; }
.meta b { color:#1c2128; }
.clientes { margin-top:8px; padding:8px 10px; background:#f9fafb; border-radius:8px; font-size:12px; }
.clientes .ci { display:inline-block; background:#fff; border:1px solid #e5e7eb; border-radius:6px; padding:2px 8px; margin:2px 4px 2px 0; }
.detail { margin-top:10px; border-top:1px solid #eef0f2; padding-top:10px; font-size:13px; display:none; }
.detail.open { display:block; }
a { color:var(--blue); }
.empty { text-align:center; color:#98a2b3; padding:30px; }
.cbtn { margin-top:6px; padding:7px 14px; background:var(--green); color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
.ttab { border-collapse:collapse; margin:4px 0 8px; font-size:12px; width:100%; }
.ttab th, .ttab td { border:1px solid #cbd5e1; padding:3px 10px; text-align:left; }
.ttab th { background:#d1fae5; color:#065f46; }
.toggle-hint { font-size:11px; color:#98a2b3; }
.spinner-row { display:flex; align-items:center; gap:8px; color:#98a2b3; font-size:12px; }
.spinner { width:13px; height:13px; border:2px solid #e5e7eb; border-top-color:var(--green); border-radius:50%; animation:spin .7s linear infinite; flex:0 0 auto; }
@keyframes spin { to { transform:rotate(360deg); } }
.ratebox { margin-top:12px; padding:10px 12px; background:#f0f9f4; border:1px solid #cfe8d6; border-radius:8px; }
.ratebox .rb-lbl { font-size:11px; font-weight:700; color:#1f8a3a; text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; }
.ratebox .rb-stars { font-size:22px; cursor:pointer; letter-spacing:3px; color:#d1d5db; user-select:none; }
.ratebox .rb-stars span.on { color:#f59e0b; }
.ratebox textarea { width:100%; min-height:60px; border:1px solid #d0d5dd; border-radius:8px; padding:8px; font-size:13px; font-family:inherit; margin:8px 0; resize:vertical; }
.ratebox .rb-row { display:flex; gap:8px; align-items:center; }
.ratebox .rb-save { padding:7px 14px; background:var(--green); color:#fff; border:none; border-radius:8px; font-size:13px; font-weight:600; cursor:pointer; }
.ratebox .rb-save:disabled { opacity:.6; cursor:default; }
.ratebox .rb-status { font-size:12px; color:#667085; }
@media (max-width:680px){ .controls{ grid-template-columns:1fr; } }
.modal { position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:50; overflow:auto; padding:20px; }
.modalinner { background:#fff; max-width:900px; margin:0 auto; border-radius:12px; padding:22px 26px; box-shadow:0 10px 40px rgba(0,0,0,.25); }
</style>

const SIT_BONUS = { "Cumple":15, "Especiales":10, "Atencion":5, "Critico":0 };
const STATUS_BASE = { "aprobados":70, "bd":45, "no aprobados":20, "vetados":0 };

function norm(s){ return (s||"").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,""); }

/* ============================================================
   PARSER CSV ROBUSTO
   ============================================================ */
function parseCSV(text){
  const rows=[]; let row=[]; let field=""; let i=0; let inQ=false;
  text = (text||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  while(i<text.length){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQ=false; i++; continue; }
      field+=c; i++; continue;
    } else {
      if(c==='"'){ inQ=true; i++; continue; }
      if(c===','){ row.push(field); field=""; i++; continue; }
      if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; i++; continue; }
      field+=c; i++; continue;
    }
  }
  row.push(field); rows.push(row);
  if(rows.length && rows[rows.length-1].length===1 && rows[rows.length-1][0]==="") rows.pop();
  return rows;
}
const hnorm = s => (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();

// Carga una pestana via gviz JSONP y devuelve filas como arreglo de arreglos de texto.
// headers=true antepone la fila de encabezados (labels de columnas).
// raw=true devuelve el valor crudo (numeros sin formato regional) en vez del formateado.
function gvizFetch(id, gid, headers, raw){
  return new Promise((resolve, reject)=>{
    const cb = "__gviz_cb_"+Math.random().toString(36).slice(2);
    // gid numérico o "sheet=Nombre" (pestañas nuevas que la web lee por nombre)
    const url = "https://docs.google.com/spreadsheets/d/"+id+"/gviz/tq?tqx=out:json;responseHandler:"+cb+(String(gid).indexOf("sheet=")===0 ? "&"+encodeURI(String(gid)) : "&gid="+gid)+"&headers="+(headers?1:0);
    let done=false;
    const sc=document.createElement("script");
    const cleanup=()=>{ try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(sc.parentNode) sc.parentNode.removeChild(sc); };
    const timer=setTimeout(()=>{ if(done) return; done=true; cleanup(); reject(new Error("timeout (revisa permisos o publicacion de la planilla)")); }, 20000);
    window[cb]=(resp)=>{
      if(done) return; done=true; clearTimeout(timer); cleanup();
      try{
        const t = resp && resp.table;
        if(!t){ reject(new Error("respuesta sin tabla")); return; }
        const cell = c => {
          if(c==null) return "";
          if(!raw && c.f!=null && c.f!=="") return c.f;
          if(c.v!=null && c.v!=="") return String(c.v);
          return "";
        };
        const rows=[];
        if(headers) rows.push((t.cols||[]).map(c=> (c && (c.label||"")) ));
        (t.rows||[]).forEach(r=> rows.push((r.c||[]).map(cell).map(v=> v==null?"":String(v))) );
        resolve(rows);
      }catch(e){ reject(e); }
    };
    sc.src=url;
    sc.onerror=()=>{ if(done) return; done=true; clearTimeout(timer); cleanup(); reject(new Error("no se pudo cargar (permisos o conexion)")); };
    document.head.appendChild(sc);
  });
}

function provResiduos(name){
  const set = new Set();
  const sup = SUPPLIERS.find(x=>norm(x.name)===norm(name));
  if(sup) (sup.residuos||[]).forEach(r=>set.add(r));
  return [...set];
}

/* ============================================================
   ESPEJO -> PROVEEDORES
   ============================================================ */
let SUPPLIERS = [];

function colIndexer(headerRow){
  const Hn = (headerRow||[]).map(h=> hnorm((h||"").replace(/^cf:\s*/i,"")) );
  const HnFull = (headerRow||[]).map(h=> hnorm(h));
  return function(...names){
    for(const nm of names){
      const t = hnorm(nm.replace(/^cf:\s*/i,""));
      let idx = Hn.findIndex(h=> h===t);
      if(idx<0) idx = HnFull.findIndex(h=> h===t);
      if(idx<0) idx = Hn.findIndex(h=> h.indexOf(t)!==-1);
      if(idx<0) idx = HnFull.findIndex(h=> h.indexOf(t)!==-1);
      if(idx>=0) return idx;
    }
    return -1;
  };
}

function recalcScore(s){
  let sc = STATUS_BASE[s.estado] != null ? STATUS_BASE[s.estado] : 40;
  sc += (s.estrellas||0) * 6;
  sc += (SIT_BONUS[s.situacion] || 0);
  s.score = Math.round(sc);
}

    const actor = get(r,ci.actor), categoria = get(r,ci.categoria);
    let destinos = []; try { destinos = JSON.parse(get(r,ci.destinos) || "[]").map(d=>({ id:d.id, name:String(d.name||"").trim() })).filter(d=>d.name); } catch(e) {}
    const id = get(r,ci.id) || ("row-"+i);
    const url = get(r,ci.url);
    const ubicAll=[...areas, ubicTxt, direccion, cobertura].filter(Boolean).join(" - ");
    const residuosAll = residuos.concat(residuoTxt?[residuoTxt]:[]);
    const s = {
      id, name, url, estado,
      residuos, residuosCU: residuos.slice(), residuoTxt, areas, ubicTxt, direccion, cobertura, ubicAll, residuosAll,
      estrellas, puntaje:pPje, situacion, movimiento, correo, telefono, web, rut, contactoNombre, contactoCargo, comentarios, actor, categoria, destinos,
      clientes: [],
      score:0, sheetOnly:false
    };
    recalcScore(s);
    out.push(s);
  }
  return out;
}

async function loadAll(){
  const bar = document.getElementById("bar");
  const msg = document.getElementById("statusMsg");
  tarifasInit();
  msg.textContent = "Esperando inicio de sesión…";
  await exigirSesion();
  const tarifasP = loadTarifas();
  const sinaderP = loadSinader(); // no bloquea la carga de proveedores
  msg.textContent = "Cargando proveedores y tarifas…";
  try{
    SUPPLIERS = await loadMirror();
  }catch(e){
    bar.style.width="0%";
    msg.innerHTML = "No se pudo leer el espejo de proveedores. Verifica que la planilla esté compartida como <b>Cualquiera con el enlace → Lector</b>.<br>Detalle: "+esc((e&&e.message)||String(e));
    return;
  }
  await tarifasP;
  aplicarTarifasAProveedores(); // clientes y gestores sin ClickUp salen de Tarifas
  refreshProvDL();
  populateFilters();
  render();
  bar.style.width = "100%";
  msg.textContent = SUPPLIERS.length+" proveedores · "+(TARIFAS_ERROR ? "⚠ No se pudieron cargar las tarifas: "+TARIFAS_ERROR : TARIFAS.filter(t => t.activo).length+" tarifas");
  msg.classList.toggle("err", !!TARIFAS_ERROR);
  // El cruce por RUT necesita SINADER y proveedores: se dibuja cuando ambos están cargados.
  sinaderP.then(()=>{ render(); renderSinader(); if (/^error/.test(SINADER_STATUS)) msg.textContent += " · ⚠ No se pudo cargar SINADER"; });
}

const fmtCLP = n => "$" + Math.round(n).toLocaleString("es-CL");

/* ============================================================
   CATALOGO, FILTROS Y RENDER
   ============================================================ */
const RESIDUO_CATALOG = ["Aceite de Cocina","Aceite Lubricante","Acero Inoxidable","Agua con HC","Aguas contaminadas con HC","Aguas Grises","Aguas Servidas","Alucom","Aluminio","Animal","Arena","Asbesto friable","Asbesto no friable","Asesoria","Bateria de Auto","Biciclaje","Bidon Quimico HDPE","Binz","Biocontaminados","Biodigestion","Biodigestores","Biogas","Bodegas","Bolsa plastica","Bolsos","Bronce","Cables Electricos","Capacitaciones","Caracterizacion de residuos","Carbono neutral","Carnicos","Carton","Celulosa reciclada","Ceramica","Charlas de RCD","Charlas y talleres","Chatarra","Chipeadoras","Cobre","Colchones","Colillas","Compactadoras","Composteras","Construccion sostenible","Contenedores","De todo","Desinfectantes","Domiciliarios","DS 148","DS 42","E-waste","Ecodiseno","Eficiencia energetica","Enfardadoras","EPP","Escombro","Escoria","Excavacion","Fierro","FILM STRETCH","Grasas","HDPE","Hormigon","Huella Hidrica","Industrial","Insumos","Latas de Aluminio","LDPE","Ley REP","Libros","Limpieza de pozos","Lodos","Madera","Maquinaria","Maxisacos","Merma","Metales no ferrosos","Mix Papel-Carton","Mix Plasticos","Mortalidad","Mortandad","Motores","Neumaticos","NFU","Organicos","PAI","Pallet","Papel","PAS 40","PAS 42","Pesas","PET","Pilas Alcalinas","Placas electronicas","Planes de manejo","Planta de reciclaje","Plasticos","Plasticos Compostables","Pluma","Plumavit","Podas","PP","Productos circulares","Proyecto en manejo de residuos","Puntos limpios","PVC","Radiadores","RAEE","Ramas","RCD","REAS","REP","RESPEL","RILES","Ruido","Segregacion de residuos","Tambor Contaminado","Tambor Metalico","Tambores","Tela grafica","Tetrapack","Textil","Tierra","Tinetas","Toner","Tramitacion sanitaria","Valorizables","Valorizacion energetica","Vidrio","Visceras","Voluntariado","Yeso-Carton"];

function populateFilters(){
  const rMap = new Map(), uMap = new Map();
  const addR = v => { const k=norm(v); if(v && !rMap.has(k)) rMap.set(k, String(v).trim()); };
  const addU = v => { const k=norm(v); if(v && !uMap.has(k)) uMap.set(k, String(v).trim()); };
  SUPPLIERS.forEach(s=>{ s.residuos.forEach(addR); s.areas.forEach(addU); });
  RESIDUO_CATALOG.forEach(addR);
  const fR = document.getElementById("fResiduo"), fU = document.getElementById("fUbic");
  const rPrev = fR.value, uPrev = fU.value;
  fR.innerHTML = '<option value="">Todos</option>';
  fU.innerHTML = '<option value="">Todas</option>';
  [...rMap.values()].sort((a,b)=>a.localeCompare(b)).forEach(r=>{ const o=document.createElement("option"); o.value=r; o.textContent=r; fR.appendChild(o); });
  [...uMap.values()].sort((a,b)=>a.localeCompare(b)).forEach(u=>{ const o=document.createElement("option"); o.value=u; o.textContent=u; fU.appendChild(o); });
  fR.value = rPrev; fU.value = uPrev;
}

function activeEstados(){
  return [...document.querySelectorAll(".fEstado:checked")].map(c=>c.value);
}

function render(){
  const res = document.getElementById("fResiduo").value;
  const ubic = document.getElementById("fUbic").value;
  const text = document.getElementById("fText").value.trim().toLowerCase();
  const textRut = rutClave(text);
  const empresa = document.getElementById("fEmpresa").value.trim();
  const estados = activeEstados();
  const list = document.getElementById("list");

  let rows = SUPPLIERS.filter(s=>{
    if(estados.indexOf(estadoBucket(s.estado))===-1) return false;
    if(res && !s.residuos.some(r=>norm(r)===norm(res))) return false;
    if(ubic){ const uk=norm(ubic); if(!s.areas.some(a=>norm(a)===uk) && norm(s.ubicAll||"").indexOf(uk)===-1) return false; }
    if(text && s.name.toLowerCase().indexOf(text)===-1 && !(textRut.length>=4 && rutClave(s.rut).indexOf(textRut)!==-1)) return false;
    if(empresa){
      const ek = norm(empresa);
      const match = s.clientes.some(c=> norm(c[0]||"").indexOf(ek)!==-1 || norm(c[1]||"").indexOf(ek)!==-1);
      if(!match) return false;
    }
    return true;
  });
  rows.sort((a,b)=> b.score - a.score || a.name.localeCompare(b.name));

  document.getElementById("count").textContent = rows.length + " proveedores \u00b7 ordenados por score";
  if(!rows.length){ list.innerHTML = '<div class="empty">No hay proveedores con estos filtros. Prueba quitando el residuo, la ubicaci\u00f3n o alg\u00fan estado.</div>'; return; }

  // de a PROV_PAGINA tarjetas compactas; la ficha completa se arma al abrir la tarjeta
  if(!render._mas) PROV_LIMITE = PROV_PAGINA;
  render._mas = false;
  const quedan = rows.length - PROV_LIMITE;
  list.innerHTML = rows.slice(0, PROV_LIMITE).map((s, idx)=>{
    const bk = estadoBucket(s.estado);
    const badgeCls = bk==="otros" ? "b-sit" : "b-"+s.estado.replace(/\s+/g,"");
    const n = Math.max(0, Math.min(5, Math.round(s.estrellas||0)));
    const stars = '<span class="stars" title="Calificaci\u00f3n del equipo: '+n+' de 5">'+'\u2605'.repeat(n)+'\u2606'.repeat(5-n)+'</span>';
    const residuos = residuosUnicos(s.residuos);
    const resChips = residuos.slice(0, 6).map(r=>resTag(r,'chip')).join('') + (residuos.length>6 ? '<span class="muted small">+'+(residuos.length-6)+' m\u00e1s</span>' : '') ||
      (s.residuoTxt?'<span class="chip">'+esc(s.residuoTxt)+'</span>':'');
    const sinB = sinaderBadgeProveedor(s);
    return ''+
    '<div class="card card-compacta '+(s.estado==="vetados"?"vetado":"")+(s.estado==="planilla"?"planilla":"")+'">'+
      '<div class="card-head" onclick="toggle(\''+s.id+'\')">'+
        '<div>'+
          '<div class="rank">#'+(idx+1)+'</div>'+
          '<p class="name">'+esc(nombreLindo(s.name))+'</p>'+
          '<div class="badges"><span class="badge '+badgeCls+'">'+esc(s.estado==="planilla"?"sin ClickUp":ESTADO_PROV_TXT[s.estado]||s.estado)+'</span> '+sinB+' '+stars+'</div>'+
        '</div>'+
        '<div class="score" title="'+esc(scoreExplicado(s))+'"><div class="num">'+s.score+'</div><div class="lbl">score \u24d8</div></div>'+
      '</div>'+
      (resChips?'<div class="chips">'+resChips+'</div>':'')+
      preciosCompactos(s) +
      '<button type="button" class="lnk ver-ficha" id="vf-'+s.id+'" onclick="toggle(\''+s.id+'\')">Ver ficha completa \u25be</button>'+
      '<div class="card-full" id="f-'+s.id+'" style="display:none"></div>'+
    '</div>';
  }).join('') +
  (quedan > 0 ? '<div class="mas-prov"><button type="button" class="cbtn sec" onclick="verMasProveedores()">Mostrar '+Math.min(PROV_PAGINA, quedan)+' m\u00e1s</button> <span class="muted small">quedan '+quedan+'</span></div>' : '');
}

const PROV_PAGINA = 30;
let PROV_LIMITE = PROV_PAGINA;
function verMasProveedores(){ PROV_LIMITE += PROV_PAGINA; render._mas = true; render(); }

// "bd" es la etapa de evaluaci\u00f3n en ClickUp
const ESTADO_PROV_TXT = { aprobados:"Aprobado", bd:"Por evaluar", "no aprobados":"No aprobado", vetados:"Vetado" };
const SIT_TXT = { Cumple:"Cumple", Especiales:"Especiales", Atencion:"Atenci\u00f3n", Critico:"Cr\u00edtico" };

/** C\u00f3mo se llega al score: estado + estrellas + situaci\u00f3n (recalcScore). */
function scoreExplicado(s){
  const base = STATUS_BASE[s.estado] != null ? STATUS_BASE[s.estado] : 40;
  const est = Math.round((s.estrellas||0) * 6), sit = SIT_BONUS[s.situacion] || 0;
  return 'Score '+s.score+' = estado '+(ESTADO_PROV_TXT[s.estado]||s.estado||'-')+' ('+base+') + calificaci\u00f3n '+(Math.round(s.estrellas||0))+'\u2605 \u00d7 6 ('+est+')'+
    ' + situaci\u00f3n '+(SIT_TXT[s.situacion]||s.situacion||'sin dato')+' ('+sit+').\nM\u00e1ximo 115: Aprobado (70) + 5\u2605 (30) + Cumple (15).';
}

/** Hasta 2 precios de la referencial en la tarjeta compacta. */
function preciosCompactos(s){
  const fs = referencialRegiones(tarifasDeProveedor(s)).filter(f=>f.valor!=null).sort((a,b)=>(a.tipo==="m3"?0:1)-(b.tipo==="m3"?0:1));
  if(!fs.length) return '';
  return '<div class="precios-comp">'+fs.slice(0,2).map(f=>'<span class="small ref-linea">'+resTag(f.residuo)+(f.region?' <span class="muted">'+esc(f.region)+'</span>':'')+
    ' <b class="'+(f.paga?'t-paga':'')+'">'+fmtCLP(f.valor)+'</b> <span class="muted">/ '+esc(f.tipo==="m3"?"m\u00b3":f.unidad||"")+'</span>'+(f.fuera?' <span class="t-alerta" title="'+esc(f.fuera.txt)+'">\u26a0</span>':'')+'</span>').join('')+
    (fs.length>2?'<span class="muted small">+'+(fs.length-2)+' precios m\u00e1s</span>':'')+'</div>';
}

/** Lo que antes estaba siempre a la vista: contacto, todos los residuos, referencial, \u00e1rea, situaci\u00f3n y clientes. */
function cardFullHtml(s){
  const residuos = residuosUnicos(s.residuos);
  const resChips = residuos.map(r=>resTag(r,'chip')).join('');
  const areaChips = s.areas.length ? s.areas.map(a=>'<span class="chip loc">'+esc(a)+'</span>').join('') : '';
  const ubicExtra = [s.ubicTxt, s.direccion].filter(Boolean).join(' - ');
  const areaLine = (s.areas.length || ubicExtra)
    ? '<div class="meta"><b>\u00c1rea de acci\u00f3n:</b> '+(areaChips||'')+(ubicExtra?' <span style="color:#475467">'+esc(ubicExtra)+'</span>':'')+'</div>'
    : (s.sheetOnly ? '' : '<div class="meta"><b>\u00c1rea de acci\u00f3n:</b> <span class="toggle-hint">no especificada</span></div>');
  const cli = s.clientes.length
    ? '<div class="clientes"><b>Clientes (tarifas):</b><br>'+s.clientes.map(c=>'<span class="ci">'+esc(empresaVisible(c[0]))+(c[1]?' - '+esc(c[1]):'')+'</span>').join('')+'</div>'
    : '';
  const meta = [];
  if(s.situacion) meta.push('<span class="badge b-sit" title="Situaci\u00f3n en ClickUp">Situaci\u00f3n: '+esc(SIT_TXT[s.situacion]||s.situacion)+'</span>');
  if(s.movimiento) meta.push('<span class="badge b-sit" title="Nivel de movimiento en ClickUp">Movimiento '+esc(String(s.movimiento).toLowerCase())+'</span>');
  if(s.puntaje!=null) meta.push('<span class="badge b-sit" title="Campo Puntaje de ClickUp">Puntaje ClickUp: '+s.puntaje+'</span>');
  return contactoHtml(s) +
    (resChips?'<div class="meta" style="margin-top:8px"><b>Residuos que gestiona:</b></div><div class="chips">'+resChips+'</div>':'')+
    tarifasResumenProveedor(s) +
    areaLine +
    (meta.length?'<div class="badges">'+meta.join(' ')+'</div>':'')+
    cli +
    '<div class="detail" id="d-'+s.id+'"></div>';
}

/** Bloque de contacto de la tarjeta: persona, correo, teléfono, web, RUT y acceso a la tarjeta de ClickUp. */
function contactoHtml(s){
  const persona = [s.contactoNombre, s.contactoCargo].filter(Boolean).map(esc).join(' · ');
  const dato = (etq, html) => '<span class="ct-dato"><span class="ct-etq">'+etq+'</span> '+html+'</span>';
  const datos = [];
  if(persona) datos.push(dato('Persona', persona));
  if(s.correo) datos.push(dato('Correo', '<a href="mailto:'+esc(s.correo)+'">'+esc(s.correo)+'</a>'));
  if(s.telefono) datos.push(dato('Teléfono', esc(s.telefono)));
  if(s.web) datos.push(dato('Web', '<a href="'+esc(/^https?:/i.test(s.web)?s.web:'https://'+s.web)+'" target="_blank" rel="noopener">'+esc(s.web.replace(/^https?:\/\/(www\.)?/i,'').replace(/\/$/,''))+'</a>'));
  if(s.rut) datos.push(dato('RUT', esc(s.rut)));
  const cu = s.url ? '<span class="ct-acciones">'+botonEditarTarifas(s.name)+botonEditarFicha(s.id)+'<a class="ct-clickup" href="'+esc(s.url)+'" target="_blank" rel="noopener">Abrir en ClickUp ↗</a></span>' : '';
  if(s.sheetOnly) return '<div class="contacto fuera"><span class="toggle-hint">Proveedor fuera del ecosistema: sin ficha en ClickUp</span>'+'<span class="ct-acciones">'+botonEditarTarifas(s.name)+botonCrearFicha(s.name)+'</span></div>';
  if(!datos.length && !cu) return '';
  return '<div class="contacto">'+(datos.length ? datos.join('') : '<span class="toggle-hint">Sin datos de contacto en ClickUp</span>')+cu+'</div>';
}

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c])); }

function toggle(id){
  const s = SUPPLIERS.find(x=>x.id===id);
  const full = document.getElementById("f-"+id), btn = document.getElementById("vf-"+id);
  if(!s || !full) return;
  const abrir = full.style.display === "none";
  full.style.display = abrir ? "" : "none";
  if(btn) btn.textContent = abrir ? "Ocultar ficha ▴" : "Ver ficha completa ▾";
  if(!abrir || full.dataset.lista) return;
  full.dataset.lista = "1"; // la ficha y sus comentarios se cargan una sola vez
  full.innerHTML = cardFullHtml(s);
  const el = document.getElementById("d-"+id);
  el.classList.add("open");
  const extra = [];
  if(s.direccion) extra.push('<div class="meta"><b>Dirección:</b> '+esc(s.direccion)+'</div>');
  if(s.cobertura) extra.push('<div class="meta"><b>Cobertura:</b> '+esc(s.cobertura)+'</div>');
  if(s.movimiento) extra.push('<div class="meta"><b>Movimiento:</b> '+esc(s.movimiento)+'</div>');
  extra.push(tarifasDetalleProveedor(s));
  extra.push(sinaderDetalleProveedor(s));

  if(!s.sheetOnly){
    extra.push('<div class="meta" style="margin-top:10px;"><b>Comentarios ClickUp</b></div>'+
      '<div id="cmlist-'+s.id+'"><div class="spinner-row"><span class="spinner"></span> Cargando comentarios...</div></div>');
  }

  if(!s.sheetOnly){
    const curStars = Math.max(0, Math.min(5, Math.round(s.estrellas||0)));
    extra.push(
      '<div class="ratebox" id="rb-'+s.id+'">'+
        '<div class="rb-lbl">Calificar y comentar (se sincroniza con ClickUp)</div>'+
        '<div class="rb-stars" id="rbstars-'+s.id+'">'+
          [1,2,3,4,5].map(n=>'<span data-n="'+n+'" onclick="pickStar(\''+s.id+'\','+n+')" class="'+(n<=curStars?'on':'')+'">\u2605</span>').join('')+
        '</div>'+
        '<textarea id="rbtext-'+s.id+'" placeholder="Escribe un comentario para el equipo y ClickUp..."></textarea>'+
        '<div class="rb-row">'+
          '<button class="rb-save" id="rbbtn-'+s.id+'" onclick="submitRating(\''+s.id+'\')">Guardar en ClickUp</button>'+
          '<span class="rb-status" id="rbstatus-'+s.id+'"></span>'+
        '</div>'+
      '</div>'
    );
  }

  let html = extra.length ? extra.join('') : '<span class="toggle-hint">Sin detalle adicional.</span>';
  if(s.sheetOnly) html = '<span class="toggle-hint">Gestor sin ficha en ClickUp: aparece solo por sus tarifas.</span>' + html;
  el.innerHTML = html;

  if(!s.sheetOnly) loadComments(s.id);
}

async function loadComments(id){
  const box = document.getElementById("cmlist-"+id);
  if(!box) return;
  if(APPS_SCRIPT_URL.indexOf("PEGAR_AQUI") !== -1){
    box.innerHTML = '<span class="toggle-hint">Falta configurar APPS_SCRIPT_URL para ver/eliminar comentarios.</span>';
    return;
  }
  try{
    const data = await api("list", { taskId: id }, false);
    const box2 = document.getElementById("cmlist-"+id); // por si se cerro/abrio el detalle mientras cargaba
    if(!box2) return;
    if(!(data.comments||[]).length){
      box2.innerHTML = '<span class="toggle-hint">Sin comentarios en ClickUp.</span>';
      return;
    }
    box2.innerHTML = data.comments.map(c=>{
      const fecha = c.date ? new Date(parseInt(c.date,10)).toLocaleString("es-CL") : "";
      const cabeza = [c.user, fecha].filter(Boolean).join(" - ");
      return '<div style="background:#f9fafb;border-left:3px solid #cbd5e1;padding:6px 10px;margin:4px 0;border-radius:0 6px 6px 0;font-size:12.5px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">'+
        '<div>'+(cabeza?'<span style="font-size:11px;color:#98a2b3;font-weight:600;">'+esc(cabeza)+'</span><br>':'')+esc(c.text).replace(/\n/g,'<br>')+'</div>'+
        '<button title="Eliminar comentario" onclick="deleteComment(\''+id+'\',\''+c.id+'\')" style="border:none;background:transparent;color:#98a2b3;cursor:pointer;font-size:14px;line-height:1;padding:2px;">\u2716</button>'+
      '</div>';
    }).join('');
  }catch(err){
    box.innerHTML = '<span class="toggle-hint">Error al cargar comentarios: '+esc(err.message)+'</span>';
  }
}

async function deleteComment(taskId, commentId){
  if(!confirm("¿Eliminar este comentario de ClickUp? Esta acción no se puede deshacer.")) return;
  try{
    await api("delete", { commentId: commentId, taskId: taskId }, true);
    loadComments(taskId);
  }catch(err){
    alert("No se pudo eliminar: " + err.message);
  }
}

let RB_SELECTED = {};
function pickStar(id, n){
  RB_SELECTED[id] = n;
  const box = document.getElementById("rbstars-"+id);
  if(!box) return;
  box.querySelectorAll("span").forEach(sp=>{
    sp.classList.toggle("on", parseInt(sp.dataset.n,10) <= n);
  });
}

async function submitRating(id){
  const s = SUPPLIERS.find(x=>x.id===id);
  if(!s) return;
  const n = RB_SELECTED[id] != null ? RB_SELECTED[id] : Math.round(s.estrellas||0);
  const texto = (document.getElementById("rbtext-"+id).value||"").trim();
  const statusEl = document.getElementById("rbstatus-"+id);
  const btn = document.getElementById("rbbtn-"+id);
  if(!n && !texto){ statusEl.textContent = "Elige una calificación o escribe un comentario."; return; }
  if(APPS_SCRIPT_URL.indexOf("PEGAR_AQUI") !== -1){
    statusEl.textContent = "Falta configurar APPS_SCRIPT_URL en el HTML.";
    return;
  }
  btn.disabled = true;
  statusEl.textContent = "Guardando...";
  try{
    await api("save", { taskId: id, nombre: s.name, estrellas: n, comentario: texto }, true);
    s.estrellas = n;
    recalcScore(s);
    statusEl.textContent = "Guardado y sincronizado con ClickUp.";
    document.getElementById("rbtext-"+id).value = "";
    render();
    loadComments(id);
  }catch(err){
    statusEl.textContent = "Error al guardar: " + err.message;
  }finally{
    btn.disabled = false;
  }
}

document.getElementById("residuoDL").innerHTML = RESIDUO_CATALOG.map(r=>'<option value="'+esc(r)+'">').join('');
function refreshProvDL(){ const el=document.getElementById("provDL"); if(el) el.innerHTML = SUPPLIERS.map(s=>'<option value="'+esc(s.name)+'">').join(''); }
["fResiduo","fUbic"].forEach(id=>document.getElementById(id).addEventListener("change", render));
document.getElementById("fText").addEventListener("input", render);
document.getElementById("fEmpresa").addEventListener("input", render);
document.querySelectorAll(".fEstado").forEach(c=>c.addEventListener("change", render));

loadAll();
</script>
